name: Deploy Firebase (rules, functions, web dispatcher)

# Manual only: GitHub → Actions → "Deploy Firebase" → Run workflow.
# Needs repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON key).
# Stripe billing functions are NOT deployed here (stage 6).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Check that the key is configured
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing. See docs/FIREBASE-DEPLOY.md"
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy rules and member functions
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          KEYFILE="$RUNNER_TEMP/sa.json"
          printf '%s' "$KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEYFILE"
          set +e
          bash scripts/deploy-firebase.sh 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          code=${PIPESTATUS[0]}
          rm -f "$KEYFILE"
          if [ "$code" != "0" ]; then
            # Show the end of the log as annotations (readable without opening raw logs).
            # One annotation (GitHub keeps max 10 per step); newlines encoded as %0A.
            msg=$(grep -v '^\s*$' "$RUNNER_TEMP/deploy.log" | tail -n 40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Deploy failed::$msg"
            exit "$code"
          fi
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
