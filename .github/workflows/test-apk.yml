name: Publish test APK

# Builds the debug APK and publishes it at a permanent link:
# https://karjieroreisai.web.app/apk (Firebase Hosting) and the GitHub release "testas".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/make-signing-key.py"
      - "site/**"
      - "scripts/deploy-firebase.sh"
      - ".github/workflows/test-apk.yml"

permissions:
  contents: write

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Prepare Firebase client configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 scripts/prepare-firebase-config.py
      - name: Stable signing key (same every build, derived from a secret)
        env:
          APK_SIGNING_SEED: ${{ secrets.APK_SIGNING_SEED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet "cryptography>=44"
          PW=$(python3 scripts/make-signing-key.py "$RUNNER_TEMP/kr.p12")
          echo "::add-mask::$PW"
          echo "KR_KEYSTORE=$RUNNER_TEMP/kr.p12" >> "$GITHUB_ENV"
          echo "KR_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Check signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "DN|SHA-256" | tee /dev/stderr | grep -q "CN=KarjeroReisai" 
      - name: Publish to release "testas"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk KarjeroReisai-testas.apk
          NOTES="Testinė versija $VERSION (debug). Atnaujinama automatiškai po kiekvieno programėlės pakeitimo. $(date -u +%Y-%m-%d)"
          if gh release view testas --repo "$REPO" >/dev/null 2>&1; then
            gh release upload testas KarjeroReisai-testas.apk --clobber --repo "$REPO"
            gh release edit testas --title "Testinė versija $VERSION" --notes "$NOTES" --repo "$REPO"
          else
            gh release create testas KarjeroReisai-testas.apk --prerelease --title "Testinė versija $VERSION" --notes "$NOTES" --target "$GITHUB_SHA" --repo "$REPO"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Publish to karjieroreisai.web.app/apk (works with a private repository)
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          KEYFILE="$RUNNER_TEMP/sa.json"
          printf '%s' "$KEY" > "$KEYFILE"; chmod 600 "$KEYFILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEYFILE"
          APK_FILE="$PWD/KarjeroReisai-testas.apk" HOSTING_ONLY=1 bash scripts/deploy-firebase.sh
          rm -f "$KEYFILE"
